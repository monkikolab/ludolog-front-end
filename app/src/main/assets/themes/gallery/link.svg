  <!--
    Ludolog Link en el tema Gallery: el icono de la app. La gema con el ojo —la misma de
    companion.svg— y dos ondas a cada lado: Ludolog, hablando por Wi-Fi.

    Lo genera tools/link-marks.py (fuentes de los temas); retocar alli, no aqui. Las ondas son
    poligonos y no arcos con trazo porque el lector de marcas solo entiende figuras rellenas de
    rectas. Los grises son luz, no color: los del Companion, y la onda cercana clara y la lejana
    apagada, como en el icono.
  -->
  <defs>
    <style>
      .clara  { fill: #fcfcfc; }
      .media  { fill: #d6d6d6; }
      .canto  { fill: #c1c1c1; }
      .sombra { fill: #686868; }
      .pupila { fill: #424242; }
    </style>
  </defs>

