# Los juegos de Android instalados como apps.
#
# No tiene extensiones y por eso el escaneo nunca la toca: sus «juegos» no son ficheros
# sino paquetes, y quien decide cuales entran es el menu del cajon de apps. El giro es el
# telefono que rinde tools/psx-apps.sh.
[[system]]
id = "android"
maker = "Google"
year = 2008
name = "Android games"
label = "ANDROID"
video = "apps/phone.mp4"
description = "Games installed as Android apps. Send one here from the app drawer, holding A on it."
extensions = []
