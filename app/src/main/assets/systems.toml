# Catalogo de sistemas.
#
# Cada [[system]] es una consola. Para anadir una nueva basta con pegar un
# bloque mas al final de este archivo, o dejar un .toml propio en
# <unidad>/Ludolog/systems/ : se fusiona por id, lo que este
# aqui y no alli se conserva.

[defaults]
zipExtensions = ["zip", "7z"]
regionSuffixes = [
  "usa", "us", "na", "jp", "japan", "eu", "europe", "pal", "ntsc", "world", "wor",
]
# Extensiones demasiado genericas para identificar una consola por si solas.
# Y las que una sola consola reclama pero que en la carpeta de OTRA no son suyas: un
# README.md en la de PlayStation salia como juego de Mega Drive, un .ccd de CloneCD como
# uno de PC-FX, y un .pkg de Vita como uno de PS3. En su propia carpeta se siguen leyendo.
ambiguousExtensions = [
  "app", "bin", "rom", "dat", "img", "iso", "chd", "cue", "elf", "m3u",
  "md", "ccd", "toc", "pkg",
]

