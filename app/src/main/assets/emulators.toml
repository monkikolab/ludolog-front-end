# Emuladores como plantillas de intent.
#
# Cada [[emulator]] dice como se le entrega un juego a una app. Para anadir
# uno nuevo, copia el bloque de otro parecido y cambia pkg y activity.
#
# hand:  DATA_URI    el juego va en el data del intent, como content://
#        EXTRA_PATH  la ruta absoluta, en el extra que diga extraKey
#        EXTRA_URI   un content://, en el extra que diga extraKey

[[emulator]]
id = "duckstation"
label = "DuckStation"
pkg = "com.github.stenzek.duckstation"
activity = "com.github.stenzek.duckstation.EmulationActivity"
hand = "EXTRA_PATH"
extraKey = "bootPath"

