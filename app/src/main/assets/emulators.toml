# Con su accion y el numero de la tienda, que es lo que lleva dentro un .steam. Asi lo lee
# GameNative (IntentLaunchManager.parseLaunchIntent): app_id como entero y game_source como
# texto, STEAM si falta. Entregandole el fichero por URI solo se abria su biblioteca.
[[emulator]]
id = "gamenative"
label = "GameNative"
pkg = "app.gamenative"
activity = "app.gamenative.MainActivity"
action = "app.gamenative.LAUNCH_GAME"
hand = "FILE_INT"
extraKey = "app_id"
sourceExtra = "game_source"

[[emulator]]
id = "gamehub"
label = "GameHub Lite"
pkg = "gamehub.lite"
activity = "com.xj.landscape.launcher.ui.gamedetail.GameDetailActivity"
action = "gamehub.lite.LAUNCH_GAME"
# El id de la tienda como texto, con su clave segun el fichero, y que arranque solo: sin
# autoStartGame abria la ficha del juego y ahi se quedaba. Visto en JUMP y en Daijisho.
hand = "STORE_ID"
idExtras = ["steam:steamAppId", "gamehub:localGameId"]
boolExtras = ["autoStartGame"]

[[emulator]]
id = "winlator"
label = "Winlator (Cmod builds)"
pkg = "com.winlator.cmod"
altPkgs = ["com.cmodded.winlator"]   # forks que aceptan el mismo intent
activity = "com.winlator.cmod.XServerDisplayActivity"
hand = "EXTRA_PATH"
extraKey = "shortcut_path"

[[emulator]]
id = "eden"
label = "Eden"
pkg = "dev.eden.eden_emulator"
activity = "org.yuzu.yuzu_emu.activities.EmulationActivity"
# La accion es la de NFC y no VIEW: es la que su EmulationActivity atiende para abrir un
# juego que le llega de fuera, segun su propia guia para front-ends (docs/user/ThirdParty.md).
# Con VIEW arrancaba, no encontraba que abrir y salia («saliendo»).
action = "android.nfc.action.TECH_DISCOVERED"
hand = "DATA_URI"

